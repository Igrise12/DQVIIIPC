name: CI
on:
  push:
    branches: [main]
  pull_request:

# CI never has game data. Only tests labelled "unit" (and "e2e" in recomp-e2e) run here.

env:
  # SDL3 is built from third_party/SDL (ADR-0005); these are the headers its Linux video, input and audio
  # backends need. Window tests use SDL's dummy video driver, so no display is required.
  SDL3_LINUX_DEPS: >-
    libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev
    libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev
    libgles2-mesa-dev libdrm-dev libgbm-dev libasound2-dev libpulse-dev libdbus-1-dev libudev-dev
  SDL_VIDEO_DRIVER: dummy
  SDL_AUDIO_DRIVER: dummy
  # The movie decoder library dq8-movie links the system's libavcodec and libavutil (ADR-0015, cmake/Movie.cmake);
  # the Linux jobs build and test it (DQ8_FFMPEG=system fails the configuration if they are missing).
  FFMPEG_LINUX_DEPS: libavcodec-dev libavutil-dev

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux GCC",   os: ubuntu-24.04, preset: ci-gcc,   cc: gcc-13,   cxx: g++-13 }
          - { name: "Linux Clang", os: ubuntu-24.04, preset: ci-clang, cc: clang-18, cxx: clang++-18 }
          - { name: "Windows MSVC", os: windows-2022, preset: ci-msvc }
    steps:
      - uses: actions/checkout@v5
      - name: Submodules (pinned subset, scripts/init_submodules.sh)
        shell: bash
        run: bash scripts/init_submodules.sh
      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build ${{ matrix.cc }} ${{ env.SDL3_LINUX_DEPS }} ${{ env.FFMPEG_LINUX_DEPS }}
      - name: Register compiler problem matchers (errors become annotations readable without the logs)
        shell: bash
        run: |
          echo "::add-matcher::.github/problem-matchers/gcc.json"
          echo "::add-matcher::.github/problem-matchers/msvc.json"
      # The paraLLEl-GS backend stays OFF on MSVC (its MSVC build is unverified in M3, Docs/milestones/M3-boots.md).
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} ${{ runner.os == 'Linux' && format('-DCMAKE_C_COMPILER={0} -DCMAKE_CXX_COMPILER={1} -DDQ8_FFMPEG=system', matrix.cc, matrix.cxx) || '-DDQ8_BUILD_GS_PARALLEL=OFF' }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      - name: Unit tests
        run: ctest --preset unit-${{ matrix.preset }}
      - name: Smoke-run dq8ctl and dq8-game
        shell: bash
        run: |
          for tool in dq8ctl dq8-game dq8-launcher; do
            exe=$(find build/${{ matrix.preset }} -name "$tool" -o -name "$tool.exe" | head -1)
            "$exe" --version
          done

  sanitizers:
    name: Linux Clang ASan+UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Submodules (pinned subset, scripts/init_submodules.sh)
        shell: bash
        run: bash scripts/init_submodules.sh
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18 ${{ env.SDL3_LINUX_DEPS }} ${{ env.FFMPEG_LINUX_DEPS }}
      - run: echo "::add-matcher::.github/problem-matchers/gcc.json"
      - run: cmake --preset asan -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 -DDQ8_FFMPEG=system
      - run: cmake --build --preset asan --parallel
      - run: ctest --preset unit-asan

  # ps2_recomp built from the pinned submodules (FetchContent disconnected), then hand-assembled MIPS fixtures
  # through recompile -> game module -> dq8-game (tests/e2e/README.md). No game data.
  recomp-e2e:
    name: Linux GCC 13 recompile end-to-end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Submodules (pinned subset, scripts/init_submodules.sh)
        shell: bash
        run: bash scripts/init_submodules.sh
      - run: sudo apt-get update && sudo apt-get install -y ninja-build gcc-13 g++-13
      - run: echo "::add-matcher::.github/problem-matchers/gcc.json"
      # Headless only: the end-to-end runs need neither the window nor the paraLLEl-GS backend.
      - name: Configure
        run: >-
          cmake --preset ci-gcc -DCMAKE_C_COMPILER=gcc-13 -DCMAKE_CXX_COMPILER=g++-13
          -DDQ8_BUILD_RECOMP=ON -DDQ8_BUILD_E2E=ON -DDQ8_BUILD_WINDOW=OFF -DDQ8_BUILD_GS_PARALLEL=OFF
      - name: Build (host, ps2_recomp, fixture generator)
        run: cmake --build --preset ci-gcc --parallel
      - name: End-to-end tests
        run: ctest --test-dir build/ci-gcc -L e2e --output-on-failure
      - name: Keep the recompiler and e2e logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: recomp-e2e-logs
          path: |
            build/ci-gcc/ps2recomp/log/
            build/ci-gcc/tests/e2e/work/**/*.log
            build/ci-gcc/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  lint:
    name: Lint and policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Submodules (pinned subset, scripts/init_submodules.sh)
        shell: bash
        run: bash scripts/init_submodules.sh
      - name: No game-derived content
        run: python3 -I scripts/check_no_game_data.py --tree
      - name: pre-commit hooks (clang-format pinned by .pre-commit-config.yaml, whitespace, checker)
        run: |
          pipx install pre-commit
          pre-commit run --all-files --show-diff-on-failure
      - name: REUSE compliance
        uses: fsfe/reuse-action@v5
      - name: Markdown links (local only)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments 'README.md' 'CLAUDE.md' 'Docs/**/*.md'
          fail: true
