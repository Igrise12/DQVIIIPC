# Region profile: Dragon Quest VIII, NTSC-U (SLUS-21207). Schema: data/README.md.
# Names, sizes, addresses and hashes only (architecture.md §14). Facts come from Docs/project-brief.md §6;
# hashes for overlays and modules are filled in from `dq8ctl extract --emit-profile` on a verified disc.
schema_version = 1

[profile]
id = "SLUS_21207"
serial = "SLUS-21207"
title = "Dragon Quest VIII: Journey of the Cursed King"
region = "NTSC-U"
video_mode = "NTSC"

[image]
size = 4180148224
sector_size = 2048

[boot]
path = "SLUS_212.07"
size = 2960032
sha1 = "f24bfd21c21f6454c05934224ab52cde837bc90b"
crc32 = "a66a08b0"
entry = 0x00100008
load_address = 0x00100000
main_memsz = 0x361C80

# The window the six overlays share, and the loader facts spike S3 established (Docs/spikes/S3-overlay-loader.md):
# the loader reads a whole BIN file, header included, to the address held at window_pointer, calls the empty
# loader_hook, flushes the caches through flush_cache_stub, zeroes bss and runs the header's constructor table
# through ctor_walker. load_by_index loads by position in name_table (order below); lsn_cache holds the start
# sectors; mode_variable is what the main loop switches on. The heap begins at `end`.
[overlay_window]
base = 0x00461C80
end = 0x00489A80
container = "MWo3"
header_size = 64
code_offset = 0x40
window_pointer = 0x003D1704
loader = 0x00100330
loader_hook = 0x00100320
load_by_index = 0x00169860
name_table = 0x003950F0
name_table_order = ["TITLE", "CASINO", "VIEWER", "BATTLE", "MENU", "SHOP"]
lsn_cache = 0x003F8850
ctor_walker = 0x00100DE0
flush_cache_stub = 0x00116AA0
mode_variable = 0x003D2740

# One row per overlay. `id` is the header's overlay_id, `index` its position in name_table_order (the loader's
# argument), `segment_index` the matching zero-filesize PT_LOAD of the boot ELF counting load segments from 0
# (the main image). text_size, data_size, bss_size and table_entries are what the header must declare;
# header_size + text_size + data_size + bss_size == segment_memsz and header_size + text_size + data_size == size.

[[overlays]]
name = "CASINO"
id = 1
index = 1
segment_index = 1
path = "BIN/CASINO.BIN"
text_size = 0x1ADC0
data_size = 0x4D80
bss_size = 0x1380
table_entries = 5
segment_memsz = 0x20F00
