"game.memory_card2.label" = "Second memory card"
"game.memory_card2.description" = "Whether a second memory card is inserted."
"game.memory_card2.choices.none" = "Not inserted"
"game.memory_card2.choices.formatted" = "Inserted, formatted"
"game.memory_card2.choices.unformatted" = "Inserted, unformatted"
