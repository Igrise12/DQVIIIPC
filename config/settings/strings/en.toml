"display.integer_scaling.description" = "Scale the picture only by whole numbers, for even pixels; leaves borders around it."
"display.filter.label" = "Scaling filter"
"display.filter.description" = "How the picture is smoothed when it is scaled to the window."
"display.filter.choices.linear" = "Smooth"
"display.filter.choices.nearest" = "Sharp pixels"

"audio.output.label" = "Audio output"
"audio.output.description" = "Play sound through the system, or mute everything."
"audio.output.choices.sdl" = "System audio"
"audio.output.choices.null" = "None (muted)"
"audio.device.label" = "Audio device"
"audio.device.description" = "The device to play sound on; empty uses the system default."
"audio.volume.label" = "Volume"
"audio.volume.description" = "The game's overall volume."
"audio.latency_ms.label" = "Audio latency"
"audio.latency_ms.description" = "The audio buffer in milliseconds. Raise it if the sound crackles."

"input.profile.label" = "Controller profile"
"input.profile.description" = "The button layout to use; edit profiles on the Controllers page."
"input.deadzone.label" = "Stick dead zone"
"input.deadzone.description" = "How far a stick must move, in percent, before the game sees it."
"input.rumble.label" = "Vibration"
"input.rumble.description" = "Let the game vibrate controllers that support it."
