"display.width.description" = "The window's width in pixels when the game starts."
"display.height.label" = "Window height"
"display.height.description" = "The window's height in pixels when the game starts."
"display.vsync.label" = "Vertical sync"
"display.vsync.description" = "Wait for the monitor's refresh before showing a frame, to avoid tearing."
"display.internal_resolution.label" = "Internal resolution"
"display.internal_resolution.description" = "Render the game at a multiple of its original resolution for a sharper picture. Higher values need a faster graphics card."
"display.internal_resolution.choices.1x" = "Original (1x)"
"display.internal_resolution.choices.2x" = "2x"
"display.internal_resolution.choices.3x" = "3x"
"display.internal_resolution.choices.4x" = "4x"
"display.aspect.label" = "Aspect ratio"
"display.aspect.description" = "Automatic follows the game's own screen-size option (4:3 or 16:9); the others force a shape."
"display.aspect.choices.auto" = "Automatic"
