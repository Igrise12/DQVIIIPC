# English texts for the settings schema (../schema.toml): "<key>.label", "<key>.description" and
# "<key>.choices.<value>", plus the page names "category.<name>". Our own wording; never text from the game.

[strings]
"category.display" = "Display"
"category.audio" = "Audio"
"category.input" = "Input"
"category.game" = "Game"
"category.advanced" = "Advanced"

"display.window_mode.label" = "Window mode"
"display.window_mode.description" = "Play in a window, in a borderless window covering the screen, or in exclusive fullscreen."
"display.window_mode.choices.windowed" = "Windowed"
"display.window_mode.choices.borderless" = "Borderless fullscreen"
"display.window_mode.choices.fullscreen" = "Exclusive fullscreen"
