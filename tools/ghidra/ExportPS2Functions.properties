#
# Headless answers for PS2Recomp's ExportPS2Functions.java (ps2xRecomp/tools/ghidra), which asks
# for its two output files with askFile(). Ghidra builds each key from the askFile() title and the
# approve-button text joined by one space. Paths are relative to the working directory, which
# tools/ghidra/headless.sh sets to the repository root. Pass this directory with
# -propertiesPath "$PWD/tools/ghidra". If the script is given any arguments, Ghidra takes the
# answers from those in order instead of from this file.
Choose output TOML config file Save = work/ghidra/export/main.toml
Choose output CSV file Save = work/ghidra/export/main.csv
